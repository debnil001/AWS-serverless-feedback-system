name: Deploy Serverless Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190460274012:role/github-actions-serverless-role
          aws-region: us-east-1

      - name: Package Lambda
        run: |
          cd lambda
          zip -r ../lambda.zip .

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name feedback-handler \
            --zip-file fileb://lambda.zip

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/ \
            s3://serverless-feedback-frontend-190460274012-us-east-1-an \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3USC3WODCI1WY \
            --paths "/*"